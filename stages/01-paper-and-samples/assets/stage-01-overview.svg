<title id="title">مرحلهٔ ۱ — مقالهٔ مبنا و شناسنامهٔ نمونه‌ها</title>
<desc id="desc">نمودار شش‌بخشی دربارهٔ پژوهش Nikitina، شناسه‌های GSE89223 و SRP092131، ویژگی ۳۲ Run از ۱۷ بیمار، ترکیب بافت‌ها، انتخاب ۲۲ نمونهٔ نهایی و نکات فراداده‌ای BP3 و CP2.</desc>
